# Builds manygit for macOS, Linux and Windows (Intel & Apple/Arm silicon) and
# publishes a GitHub Release. Triggered by pushing a v* tag (see
# .github/workflows/release.yml).
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: manygit
    main: .
    binary: manygit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: manygit
    # Every OS ships the same tar.gz, windows included: Windows 10 1803+ and
    # Windows 11 both bundle tar.exe, so install.ps1 and the self-updater can
    # both just extract it — no second archive format to keep in sync. Inside
    # a windows archive goreleaser names the binary manygit.exe automatically.
    formats: [tar.gz]
    # e.g. manygit_darwin_arm64.tar.gz — the installer and self-updater expect
    # exactly this name.
    name_template: "manygit_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

# The Homebrew cask, pushed to rabeeh-ta/homebrew-manygit on every tag:
#   brew tap rabeeh-ta/manygit && brew trust rabeeh-ta/manygit && brew install manygit
#
# The trust step is not optional: since Homebrew 6.0.0 a non-official tap is not
# loaded until the user trusts it. Nothing here can waive that — it is a decision
# Homebrew reserves for the machine running the code.
#
# Casks are macOS-only by design; Linux installs through install.sh, Windows
# through install.ps1 (or install.sh under Git Bash/MSYS/WSL). Note the cask
# points at the SAME archive install.sh downloads — there is no separate brew
# build — which is why manygit works out who owns its binary at runtime rather
# than from a build flag. See docs/adr/0001-runtime-install-ownership-detection.md.
homebrew_casks:
  - name: manygit
    binaries:
      - manygit
    repository:
      owner: rabeeh-ta
      name: homebrew-manygit
      # The workflow's default GITHUB_TOKEN is scoped to this repo only and
      # cannot push to the tap. TAP_GITHUB_TOKEN is a fine-grained PAT limited
      # to homebrew-manygit with contents:write.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://rabeeh-ta.github.io/manygit/"
    # Kept under 80 chars and not starting with an article, so `brew audit`
    # passes if this ever moves to a formula.
    description: "Lazygit-style TUI for a whole tree of git repos"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/manygit"]
          end
    # Runs only on `brew uninstall --zap`, never a plain uninstall. Clears what
    # manygit created and nothing else: ~/.config/manygit/config.yml is the
    # user's own file and is deliberately left in place.
    zap:
      trash:
        - "~/.cache/manygit"

# The release body IS the in-app changelog: manygit fetches it over the GitHub
# API and shows it once after a self-update (internal/tui/changelog.go). Grouping
# the commits by their conventional-commit prefix turns the raw log into readable
# sections; anything not prefixed lands under "Other".
changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      # non-user-facing commit TYPES — the (\(.+\))? also catches scoped forms
      # like docs(readme): , not just the bare docs: prefix.
      - '^docs(\(.+\))?!?:'
      - '^test(\(.+\))?!?:'
      - '^chore(\(.+\))?!?:'
      - '^ci(\(.+\))?!?:'
      - '^style(\(.+\))?!?:'
      # website / landing-page SCOPES. The demo commits are prefixed feat(demo):
      # / feat(docs): and start with "feat", so they'd otherwise land under
      # Features. This tool's changelog is about the tool, not the site — and any
      # site change that mirrors a real tool feature ALSO has a tool-scoped commit
      # that carries the feature in, so nothing real is lost.
      - '^\w+\((demo|site|web|docs|readme|landing)\)!?:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: rabeeh-ta
    name: manygit
